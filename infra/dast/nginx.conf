# DAST target: the API behind a TLS terminator.
#
# `server/src/config/env.ts:158` refuses to boot in production with a plaintext
# APP_ORIGINS, which is the right behaviour — but it means DAST cannot probe the
# production configuration directly over http://. Rather than downgrade NODE_ENV
# and scan a different configuration than the one that ships, this puts a TLS
# terminator in front of the API, which is exactly what the ALB does in the
# topology described by docs/DEPLOYMENT.md.
#
#   ZAP -> https://localhost:8443 (nginx, TLS) -> http://bigcrm-api:3000
#
# The API container therefore runs with its real production settings: HSTS on,
# Secure cookies, upgrade-insecure-requests in the CSP.
#
# The certificate is self-signed and mounted by infra/scripts/dast-scan.sh. That
# is the one respect in which this is not the production chain: in production the
# certificate comes from ACM and is publicly trusted, so the scanner would not
# need a trust override.

server {
  listen 8443 ssl;
  http2 on;
  server_name localhost;

  # ZAP's baseline flagged "Server Leaks Version Information via Server HTTP
  # Response Header Field" 36 times. `server_tokens off` removes the version
  # token; nginx still identifies itself, which is the useful part for a client
  # debugging a proxy hop and the unhelpful part for an attacker fingerprinting
  # a build. The header itself cannot be removed entirely from nginx, so this is
  # the reduction available at this layer.
  server_tokens off;

  ssl_certificate     /etc/nginx/certs/dast.crt;
  ssl_certificate_key /etc/nginx/certs/dast.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://bigcrm-api:3000;
    proxy_http_version 1.1;

    # The API decides security headers from the *client's* request. Without
    # these the scan would exercise the development branch of that logic, and
    # the HSTS/CSP results would not describe the configuration that ships.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;

    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
  }
}
